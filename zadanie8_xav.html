<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<title>Zadanie 8 - Confirm Box</title>
<script type="text/javascript">
function show_confirm() {
    var r = confirm("Naciśnij klawisz");
    if (r == true) {
        document.write("Nacisnąłeś OK!");
    } else {
        document.write("Nacisnąłeś Cancel!");
    }
}
</script>
</head>
<body>
<!-- Xavier Ostrowski, Klasa 3F, ZSE Gdańsk -->
<p><b>Zastosowanie:</b><br>Weryfikacja lub akceptacja danych (zwraca true/false).</p>
<input type="button" onclick="show_confirm()" value="Pokaż confirm box" />
</body>
</html>
