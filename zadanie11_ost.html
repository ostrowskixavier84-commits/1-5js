<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 11 - Xavier Ostrowski</title>
    <style>
        form {
            width: 300px;
            background: #f9f9f9;
            padding: 20px;
            border: 1px solid #ccc;
        }
        input, textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>
    <form>
        <label>Imię i nazwisko:</label>
        <input type="text" required placeholder="Xavier Ostrowski">
        
        <label>E-mail:</label>
        <input type="email" required placeholder="twoj@email.com">
        
        <label>Wiadomość:</label>
        <textarea rows="4" required></textarea>
        
        <input type="submit" value="Wyślij">
    </form>
</body>
</html>
