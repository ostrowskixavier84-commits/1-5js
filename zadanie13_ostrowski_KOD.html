<div style="color:blue; font-size:40px;">
<script language="JavaScript">
var m_s = prompt("m=", "");
var m_ostrowski = parseFloat(m_s);
var m1 = m_ostrowski + 1;
var m2 = m_ostrowski * (m_ostrowski + 1);

document.write("1/" + m_ostrowski + " = 1/" + m1 + " + 1/" + m2 + "<br>");

function okno_zamknij_ostrowski() {
    window.close();
}
</script>
</div>
<input type="button" value="zamknij okno" onclick="okno_zamknij_ostrowski()"/>
