<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 16 - Wizytówka - Xavier Ostrowski</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .wizytowka {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        .wizytowka h2 {
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .wizytowka p {
            color: #7f8c8d;
            font-size: 14px;
        }
        .tag {
            display: inline-block;
            background: #e0f2f1;
            color: #00897b;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="wizytowka">
        <h2>Xavier Ostrowski</h2>
        <p>Zespół Szkół Energetycznych w Gdańsku</p>
        <p>Klasa 3F | Nr w dzienniku: 20</p>
        <span class="tag">Projekt HTML & CSS</span>
    </div>
</body>
</html>
