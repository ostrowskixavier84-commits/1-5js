<!DOCTYPE html>

<!-- Xavier Ostrowski, Klasa 3F, ZSE Gdańsk -->
<div style="color:blue; font-size:35px;">
<script language="JavaScript">
var m_s = prompt("m=", "");
var m_ostrowski = parseFloat(m_s);
var a = m_ostrowski + 2;
var b = (m_ostrowski + 1) * (m_ostrowski + 2);
var c = m_ostrowski * (m_ostrowski + 1);

document.write("1/" + m_ostrowski + " = 1/" + a + " + 1/" + b + " + 1/" + c + "<br>");

function okno_zamknij_ostrowski() {
    window.close();
}
</script>
</div>
<input type="button" value="zamknij okno" onclick="okno_zamknij_ostrowski()"/>
</body>
