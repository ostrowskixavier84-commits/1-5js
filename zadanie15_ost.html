<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 15 - Xavier Ostrowski</title>
    <style>
        @keyframes pulsowanie {
            0% { transform: scale(1); background-color: #3498db; }
            50% { transform: scale(1.15); background-color: #2ecc71; }
            100% { transform: scale(1); background-color: #3498db; }
        }
        .animowany-element {
            width: 150px;
            height: 150px;
            margin: 50px auto;
            background-color: #3498db;
            animation: pulsowanie 2s infinite;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="animowany-element"></div>
</body>
</html>
