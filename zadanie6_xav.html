<!-- Xavier Ostrowski, Klasa 3F, ZSE Gdańsk -->
<div style="color:navy; font-size:20px;">
<script language="JavaScript">
document.write("<b>1) Rodzaje okienek:</b><br>");
document.write("<b>Okienko alert</b> – wyświetla okienko dialogowe z informacją i przyciskiem OK.<br>");
document.write("<b>Okienko prompt</b> – generuje okno, w którym użytkownik może wpisać wartość, zwracaną następnie do programu.<br>");
document.write("<b>Okienko confirm</b> – służy do tego, aby użytkownik coś potwierdził. Zwraca wartość <i>true</i> w przypadku wyboru OK lub <i>false</i> w przypadku Cancel.<br><br>");

document.write("<b>2) Konwersja liczb:</b><br>");
document.write("Wczytanie zmiennej z użyciem prompt wykonywane jest jako ciąg znaków, dlatego konieczna jest konwersja na wartości liczbowe do wykonywania obliczeń:<br>");
document.write("<b>parseFloat(zmienna)</b> – konwersja zmiennej do typu float.<br>");
document.write("<b>parseInt(zmienna)</b> – konwersja zmiennej do typu int.<br>");
document.write("<b>toString(zmienna)</b> – konwersja zmiennej do typu łańcuchowego.<br><br>");

document.write("<b>3) Zasady nadawania nazw zmiennym:</b><br>");
document.write("1. Nazwa musi się zaczynać od litery, znaku '$' lub '_'.<br>");
document.write("2. Wielkość liter ma znaczenie.<br>");
document.write("3. Należy unikać słów kluczowych języka JavaScript.<br><br>");

document.write("<b>4) Typy zmiennych w JavaScript:</b><br>");
document.write("Number, String, Boolean, Null, Undefined, Object.<br>");
</script>
</div>
</body>
