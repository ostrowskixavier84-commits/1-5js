<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<title>Zadanie 13 - Ułamek egipski</title>
</head>
<body>
<!-- Xavier Ostrowski, Klasa 3F, ZSE Gdańsk -->
<div style="color:blue; font-size:40px;">
<script language="JavaScript">
var m_s = prompt("m=", "");
var m_xav = parseFloat(m_s);
var m1 = m_xav + 1;
var m2 = m_xav * (m_xav + 1);

document.write("1/" + m_xav + " = 1/" + m1 + " + 1/" + m2 + "<br>");

function okno_zamknij_xav() {
    window.close();
}
</script>
</div>
<input type="button" value="zamknij okno" onclick="okno_zamknij_xav()"/>
</body>
</html>
