<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 8 - Xavier Ostrowski</title>
    <style>
        .kontener {
            position: relative;
            width: 400px;
            height: 200px;
            background-color: #bdc3c7;
        }
        .wzgledny {
            position: relative;
            top: 10px;
            left: 10px;
            background-color: #f1c40f;
            padding: 5px;
        }
        .bezwzgledny {
            position: absolute;
            top: 50px;
            right: 20px;
            background-color: #e67e22;
            color: white;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="kontener">
        <div class="wzgledny">Element relative</div>
        <div class="bezwzgledny">Element absolute</div>
    </div>
</body>
</html>
