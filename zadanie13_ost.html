<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 13 - Xavier Ostrowski</title>
    <style>
        .przycisk {
            background-color: #8e44ad;
            color: white;
            padding: 12px 24px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.4s ease, transform 0.3s ease;
            border-radius: 4px;
        }
        .przycisk:hover {
            background-color: #9b59b6;
            transform: scale(1.1) rotate(2deg);
        }
    </style>
</head>
<body>
    <button class="przycisk">Najedź na mnie!</button>
</body>
</html>
