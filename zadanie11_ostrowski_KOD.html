<!DOCTYPE html>

<title>Zadanie 11 - Ile sekund</title>
</head>
<body>
<!-- Xavier Ostrowski, Klasa 3F, ZSE Gdańsk -->
<div style="color:green; font-size:67px;">
<script language="JavaScript">
var D1_ostrowski = prompt("Data1=", "");
var D2_ostrowski = prompt("Data2=", "");
var sekund;
var a = parseFloat(D1_ostrowski);
var b = parseFloat(D2_ostrowski);
sekund = (a - b) * 24 * 60 * 60;
document.write("Ilość sekund między dniami " + a + " i " + b + " = " + sekund + "<br>");

function okno_zamknij_ostrowski() {
    window.close();
}
</script>
</div>
<input type="button" value="zamknij okno" onclick="okno_zamknij_ostrowski()"/>
</body>
