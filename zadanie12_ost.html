<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 12 - Xavier Ostrowski</title>
    <style>
        .galeria {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 800px;
        }
        .miniaturka {
            background-color: #34495e;
            color: white;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h2>Galeria zdjęć (CSS Grid)</h2>
    <div class="galeria">
        <div class="miniaturka">Obraz 1</div>
        <div class="miniaturka">Obraz 2</div>
        <div class="miniaturka">Obraz 3</div>
        <div class="miniaturka">Obraz 4</div>
        <div class="miniaturka">Obraz 5</div>
        <div class="miniaturka">Obraz 6</div>
    </div>
</body>
</html>
